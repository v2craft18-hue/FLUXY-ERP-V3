name: chatgpt-pwa-fix
on:
  push:
    branches:
      - chatgpt-pwa-fix-20260906
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch registration
        run: python tools/chatgpt_patch_pwa_registration.py
      - name: Validate marker
        run: grep -F "updateViaCache:'none'" index.html
      - name: Commit clean result
        run: |
          rm -f tools/chatgpt_patch_pwa_registration.py .github/workflows/chatgpt-pwa-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bypass HTTP cache for service worker updates"
          git push
