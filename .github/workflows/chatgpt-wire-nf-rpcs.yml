name: chatgpt-wire-nf-rpcs

on:
  push:
    branches:
      - chatgpt-write-test-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt-write-test-20260904
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/chatgpt_wire_nf_rpcs.py
      - name: Validate diff
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -Fq "rpcName:'solicitar_nf_pedido'" index.html
          grep -Fq "rpcName:'registrar_nf_local_pedido'" index.html
          grep -Fq "nfChave:        row.nf_chave_local" index.html
          grep -Fq "Registrada localmente" index.html
          if grep -Fq "peds[idx].nfNumero=nfNum" index.html; then exit 1; fi
          if grep -Fq "peds[idx].nfSolicitada=true" index.html; then exit 1; fi
      - name: Validate JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); Path('/tmp/fluxy-inline.js').write_text(chr(10).join(re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)),encoding='utf-8')"
          node --check /tmp/fluxy-inline.js
      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/chatgpt-wire-nf-rpcs.yml .github/scripts/chatgpt_wire_nf_rpcs.py
          git commit -m "fix: route NF lifecycle through server RPCs"
          git push origin HEAD:chatgpt-write-test-20260904
